<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PhoneVerify — Login</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="auth-body">

<div class="auth-card">
  <div class="auth-logo-wrap">
    <div class="auth-logo">
      <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round"
          d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z"/>
      </svg>
    </div>
    <h1>PhoneVerify</h1>
    <p>Bulk phone number validation at scale</p>
  </div>

  <div class="auth-tabs">
    <button class="tab-btn active" data-tab="login">Sign In</button>
    <button class="tab-btn"        data-tab="register">Create Account</button>
  </div>

  <!-- Login -->
  <form id="loginForm">
    <div class="form-group">
      <label for="lEmail">Email address</label>
      <input id="lEmail" type="email" placeholder="you@example.com" autocomplete="email" required>
    </div>
    <div class="form-group">
      <label for="lPass">Password</label>
      <input id="lPass" type="password" placeholder="••••••••" autocomplete="current-password" required>
    </div>
    <div class="alert alert-error" id="loginErr"></div>
    <button type="submit" class="btn btn-primary btn-full btn-lg" id="loginBtn">
      <span class="btn-text">Sign In</span>
    </button>
  </form>

  <!-- Register -->
  <form id="registerForm" class="hidden">
    <div class="form-group">
      <label for="rName">Full name</label>
      <input id="rName" type="text" placeholder="Jane Doe" autocomplete="name" required>
    </div>
    <div class="form-group">
      <label for="rEmail">Email address</label>
      <input id="rEmail" type="email" placeholder="you@example.com" autocomplete="email" required>
    </div>
    <div class="form-group">
      <label for="rPass">Password</label>
      <input id="rPass" type="password" placeholder="Min 8 characters" autocomplete="new-password" required minlength="8">
    </div>
    <div class="alert alert-error" id="regErr"></div>
    <button type="submit" class="btn btn-primary btn-full btn-lg" id="regBtn">
      <span class="btn-text">Create Account</span>
    </button>
  </form>
</div>

<script>
  // Already logged in?
  if (localStorage.getItem('pv_token')) location.href = '/dashboard.html';

  // ── Tab switching ──────────────────────────────────────
  document.querySelectorAll('.tab-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      const tab = btn.dataset.tab;
      document.getElementById('loginForm').classList.toggle('hidden',    tab !== 'login');
      document.getElementById('registerForm').classList.toggle('hidden', tab !== 'register');
      document.getElementById('loginErr').classList.remove('show');
      document.getElementById('regErr').classList.remove('show');
    });
  });

  // ── Shared helpers ─────────────────────────────────────
  function setLoading(btn, loading) {
    const txt = btn.querySelector('.btn-text');
    const sp  = btn.querySelector('.spin');
    if (loading) {
      btn.disabled = true;
      txt.textContent = 'Please wait…';
      if (!sp) {
        const s = document.createElement('span');
        s.className = 'spin';
        btn.prepend(s);
      }
    } else {
      btn.disabled = false;
      if (sp) sp.remove();
    }
  }

  function showErr(id, msg) {
    const el = document.getElementById(id);
    el.textContent = msg;
    el.classList.add('show');
  }

  async function post(url, body) {
    const res  = await fetch(url, {
      method:  'POST',
      headers: { 'Content-Type': 'application/json' },
      body:    JSON.stringify(body)
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Request failed');
    return data;
  }

  function saveAndRedirect(data) {
    localStorage.setItem('pv_token', data.token);
    localStorage.setItem('pv_user',  JSON.stringify(data.user));
    location.href = '/dashboard.html';
  }

  // ── Login ──────────────────────────────────────────────
  document.getElementById('loginForm').addEventListener('submit', async e => {
    e.preventDefault();
    const btn = document.getElementById('loginBtn');
    setLoading(btn, true);
    document.getElementById('loginErr').classList.remove('show');
    try {
      const data = await post('/api/auth/login', {
        email:    document.getElementById('lEmail').value,
        password: document.getElementById('lPass').value
      });
      saveAndRedirect(data);
    } catch (err) {
      showErr('loginErr', err.message);
      setLoading(btn, false);
      btn.querySelector('.btn-text').textContent = 'Sign In';
    }
  });

  // ── Register ───────────────────────────────────────────
  document.getElementById('registerForm').addEventListener('submit', async e => {
    e.preventDefault();
    const btn = document.getElementById('regBtn');
    setLoading(btn, true);
    document.getElementById('regErr').classList.remove('show');
    try {
      const data = await post('/api/auth/register', {
        name:     document.getElementById('rName').value,
        email:    document.getElementById('rEmail').value,
        password: document.getElementById('rPass').value
      });
      saveAndRedirect(data);
    } catch (err) {
      showErr('regErr', err.message);
      setLoading(btn, false);
      btn.querySelector('.btn-text').textContent = 'Create Account';
    }
  });
</script>
</body>
</html>
